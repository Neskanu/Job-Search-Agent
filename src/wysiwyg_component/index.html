<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WYSIWYG CV Editor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SortableJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <!-- Google Fonts: Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #FAFAFB;
      margin: 0;
      padding: 0;
    }
    /* Section hover styling for drag handle indicator */
    .draggable-section {
      position: relative;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 6px;
      transition: all 0.2s ease;
    }
    .draggable-section:hover {
      border-color: #CBD5E1;
      background-color: #F8FAFC;
    }
    .drag-handle {
      display: none;
      position: absolute;
      left: -18px;
      top: 12px;
      cursor: grab;
      color: #94A3B8;
      font-size: 14px;
    }
    .draggable-section:hover .drag-handle {
      display: block;
    }
    /* contenteditable focus styling */
    [contenteditable="true"]:focus {
      outline: 2px solid #E94057;
      background-color: #FFFFFF;
      border-radius: 4px;
      padding: 2px 4px;
    }
    .ghost-class {
      opacity: 0.4;
      background-color: #EEF2F6;
      border: 2px dashed #94A3B8;
    }
  </style>
</head>
<body class="p-4">

  <!-- Sticky Actions Bar -->
  <div class="sticky top-0 z-50 flex items-center justify-between p-3 bg-white border border-slate-200 rounded-xl shadow-sm mb-4">
    <div class="flex items-center gap-2">
      <span class="text-xs bg-rose-50 text-rose-500 font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">WYSIWYG Canvas</span>
      <span class="text-xs text-slate-400">Drag to reorder sections. Click text to edit.</span>
    </div>
    <button onclick="saveAndCompile()" class="bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 text-white font-semibold text-xs px-4 py-2 rounded-lg shadow-sm transition-all hover:scale-105 active:scale-95">
      💾 Save & Rebuild Documents
    </button>
  </div>

  <!-- Resume Sheet Container -->
  <div class="bg-white border border-slate-200 shadow-lg rounded-xl p-8 max-w-2xl mx-auto text-slate-800" id="resume-sheet">
    <!-- Header -->
    <div class="text-center border-b border-slate-100 pb-4 mb-6">
      <h1 id="cv-name" contenteditable="true" class="text-2xl font-bold text-slate-900 tracking-tight mb-1">Your Name</h1>
      <div id="cv-contact" contenteditable="true" class="text-xs text-slate-500 font-medium">
        email@example.com | +1 234 567 8900 | Location
      </div>
    </div>

    <!-- Sections List (Sortable container) -->
    <div id="sections-list" class="space-y-6">
      <!-- Dynamically filled -->
    </div>
  </div>

  <script>
    let currentCvData = null;

    // Streamlit Bridge Protocols
    function sendToStreamlit(value) {
      const message = {
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value,
      };
      window.parent.postMessage(message, "*");
    }

    function setFrameHeight() {
      // Small timeout to allow DOM to render before calculating height
      setTimeout(() => {
        const height = document.documentElement.scrollHeight + 30;
        const message = {
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height: height
        };
        window.parent.postMessage(message, "*");
      }, 100);
    }

    // Render logic
    function renderCV(cvData) {
      if (!cvData) return;
      currentCvData = cvData;

      // Render name & contact
      document.getElementById("cv-name").innerText = cvData.name || "Your Name";
      
      const contactInfo = cvData.contact_info;
      if (Array.isArray(contactInfo)) {
        document.getElementById("cv-contact").innerText = contactInfo.join("  |  ");
      } else {
        document.getElementById("cv-contact").innerText = contactInfo || "";
      }

      // Render sections
      const listContainer = document.getElementById("sections-list");
      listContainer.innerHTML = "";

      if (Array.isArray(cvData.sections)) {
        cvData.sections.forEach((sec, sIdx) => {
          const secEl = document.createElement("div");
          secEl.className = "draggable-section mb-6";
          secEl.setAttribute("data-type", sec.type || "text");
          
          let contentHTML = "";

          if (sec.type === "text") {
            contentHTML = `<div class="sec-content text-sm text-slate-600 leading-relaxed" contenteditable="true">${sec.content || ""}</div>`;
          } 
          else if (sec.type === "list") {
            const listVal = Array.isArray(sec.content) ? sec.content.join(", ") : (sec.content || "");
            contentHTML = `<div class="sec-content text-sm text-slate-600 font-medium" contenteditable="true">${listVal}</div>`;
          } 
          else if (sec.type === "experience" || sec.type === "education") {
            contentHTML = `<div class="sec-content space-y-4">`;
            if (Array.isArray(sec.content)) {
              sec.content.forEach((item, itemIdx) => {
                const isExp = sec.type === "experience";
                const roleOrDegree = isExp ? (item.role || "Role") : (item.degree || "Degree");
                const compOrInst = isExp ? (item.company || "Company") : (item.institution || "Institution");
                const period = item.period || "";
                const location = item.location || "";

                // Bullet points
                let bulletsHTML = `<ul class="list-disc pl-5 mt-1 space-y-1 text-xs text-slate-500 font-normal">`;
                if (Array.isArray(item.bullets)) {
                  item.bullets.forEach((bullet, bIdx) => {
                    bulletsHTML += `
                      <li class="bullet-item relative group/bullet pr-8">
                        <span contenteditable="true" class="bullet-text block">${bullet}</span>
                        <button onclick="deleteBullet(this)" class="absolute right-0 top-0 hidden group-hover/bullet:block text-[10px] text-red-500 font-bold hover:underline">Delete</button>
                      </li>`;
                  });
                }
                bulletsHTML += `</ul>`;

                contentHTML += `
                  <div class="item-block border-l-2 border-slate-100 pl-3 relative group/item" data-idx="${itemIdx}">
                    <div class="flex justify-between items-baseline">
                      <div class="text-sm font-semibold text-slate-800">
                        <span contenteditable="true" class="item-title">${roleOrDegree}</span>
                        <span class="text-slate-400 font-normal"> at </span>
                        <span contenteditable="true" class="item-sub-title italic font-medium text-slate-700">${compOrInst}</span>
                      </div>
                      <div class="text-[11px] text-slate-400 font-medium text-right">
                        <span contenteditable="true" class="item-period">${period}</span>
                        ${location ? ` | <span contenteditable="true" class="item-location">${location}</span>` : `<span contenteditable="true" class="item-location hidden"></span>`}
                      </div>
                    </div>
                    ${bulletsHTML}
                    
                    <!-- Action controls under item -->
                    <div class="flex gap-3 mt-1.5 opacity-0 group-hover/item:opacity-100 transition-opacity">
                      <button onclick="addBullet(this)" class="text-[10px] text-rose-500 font-medium hover:underline">+ Add Bullet</button>
                      <button onclick="deleteItemBlock(this)" class="text-[10px] text-slate-400 font-medium hover:underline text-red-400">🗑️ Delete Block</button>
                    </div>
                  </div>`;
              });
            }
            contentHTML += `</div>`;
          }

          secEl.innerHTML = `
            <div class="drag-handle">☰</div>
            <h2 contenteditable="true" class="sec-title text-sm font-bold text-slate-900 border-b border-slate-100 pb-1 mb-2 tracking-wide uppercase">${sec.title || "Section"}</h2>
            ${contentHTML}
          `;
          listContainer.appendChild(secEl);
        });
      }

      // Initialize SortableJS for section drag & drop reordering
      new Sortable(listContainer, {
        handle: '.drag-handle',
        ghostClass: 'ghost-class',
        animation: 150,
        onEnd: function() {
          // Frame height can shift on reorder
          setFrameHeight();
        }
      });

      // Recalculate iframe size
      setFrameHeight();
    }

    // Dynamic Helper Actions
    function addBullet(btn) {
      const ul = btn.closest('.item-block').querySelector('ul');
      const li = document.createElement('li');
      li.className = 'bullet-item relative group/bullet pr-8';
      li.innerHTML = `
        <span contenteditable="true" class="bullet-text block">New bullet point. Edit me.</span>
        <button onclick="deleteBullet(this)" class="absolute right-0 top-0 hidden group-hover/bullet:block text-[10px] text-red-500 font-bold hover:underline">Delete</button>
      `;
      ul.appendChild(li);
      setFrameHeight();
    }

    function deleteBullet(btn) {
      btn.closest('li').remove();
      setFrameHeight();
    }

    function deleteItemBlock(btn) {
      if (confirm("Are you sure you want to delete this block?")) {
        btn.closest('.item-block').remove();
        setFrameHeight();
      }
    }

    // Scrape DOM and serialize updated CV structure
    function saveAndCompile() {
      const name = document.getElementById("cv-name").innerText.trim();
      
      const contactRaw = document.getElementById("cv-contact").innerText.trim();
      const contact_info = contactRaw.split("|").map(s => s.trim()).filter(s => s.length > 0);
      
      const sections = [];
      document.querySelectorAll(".draggable-section").forEach(secEl => {
        const title = secEl.querySelector(".sec-title").innerText.trim();
        const type = secEl.getAttribute("data-type");
        let content = null;

        if (type === "text") {
          content = secEl.querySelector(".sec-content").innerText.trim();
        } 
        else if (type === "list") {
          const listRaw = secEl.querySelector(".sec-content").innerText.trim();
          content = listRaw.split(",").map(s => s.trim()).filter(s => s.length > 0);
        } 
        else if (type === "experience" || type === "education") {
          content = [];
          secEl.querySelectorAll(".item-block").forEach(itemEl => {
            const item = {
              period: itemEl.querySelector(".item-period").innerText.trim(),
            };
            
            const locEl = itemEl.querySelector(".item-location");
            if (locEl && locEl.innerText.trim().length > 0) {
              item.location = locEl.innerText.trim();
            }

            if (type === "experience") {
              item.role = itemEl.querySelector(".item-title").innerText.trim();
              item.company = itemEl.querySelector(".item-sub-title").innerText.trim();
            } else {
              item.degree = itemEl.querySelector(".item-title").innerText.trim();
              item.institution = itemEl.querySelector(".item-sub-title").innerText.trim();
            }

            const bullets = [];
            itemEl.querySelectorAll(".bullet-text").forEach(bEl => {
              bullets.push(bEl.innerText.trim());
            });
            item.bullets = bullets;

            content.push(item);
          });
        }

        sections.push({ title, type, content });
      });

      const updatedCv = {
        name: name,
        contact_info: contact_info,
        sections: sections
      };

      // Send to Python
      sendToStreamlit(updatedCv);
    }

    // Streamlit message listener
    window.addEventListener("message", function(event) {
      if (event.data.type === "streamlit:render") {
        const cvData = event.data.args.cv_data;
        renderCV(cvData);
      }
    });

    // Handle height recalculation on content edit
    document.addEventListener("input", function(e) {
      setFrameHeight();
    });
  </script>
</body>
</html>
